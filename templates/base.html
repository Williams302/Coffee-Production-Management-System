<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Coffee Production{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block scripts %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('dashboard') }}">Coffee Production</a>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <a class="nav-page" href="{{ url_for('dashboard') }}"
                   {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
                <a class="nav-page" href="{{ url_for('plots') }}"
                   {% if request.endpoint == 'plots' %}aria-current="page"{% endif %}>Coffee Plots</a>
                <a class="nav-page" href="{{ url_for('activities') }}"
                   {% if request.endpoint == 'activities' %}aria-current="page"{% endif %}>Farm Activities</a>
                <a class="nav-page" href="{{ url_for('harvests') }}"
                   {% if request.endpoint in ('harvests', 'harvest_form', 'delete_harvest') %}aria-current="page"{% endif %}>Production</a>
                <a class="nav-page" href="{{ url_for('sales') }}"
                   {% if request.endpoint in ('sales', 'sale_form', 'delete_sale') %}aria-current="page"{% endif %}>Sales</a>
                <a class="nav-page" href="{{ url_for('market_prices') }}"
                   {% if request.endpoint in ('market_prices', 'market_price_form', 'delete_market_price') %}aria-current="page"{% endif %}>Market Prices</a>
                <a class="nav-page" href="{{ url_for('reports') }}"
                   {% if request.endpoint in ('reports', 'print_reports') %}aria-current="page"{% endif %}>Reports</a>
            </div>
        </nav>
    </header>
    <main class="container py-4 py-lg-5">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="{{ 'alert' if category == 'danger' else 'status' }}">
            {{ message }}
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
